# Optional configuration for specific LLM models
[llm.vision]
model = "claude-3-5-sonnet"
base_url = "https://api.openai.com/v1"
api_key = "sk-..."

# Task Execution Configuration
[task_execution]
# Task planning and execution
show_task_planning = true
show_execution_steps = true
execution_mode = "detailed"  # Options: "minimal", "detailed", "debug"
progress_style = "incremental"  # Shows step-by-step progress
command_execution_feedback = true

# Step-by-step progress indicators
[task_execution.progress]
show_current_action = true
show_command_output = true
show_tool_usage = true
show_thinking_process = true
progress_update_interval = 0.5  # seconds

# Tool Integration Configuration
[tool_integration]
# Terminal execution
terminal_feedback = true
command_validation = true
error_handling = "detailed"
show_command_preview = true

# Editor integration
file_operation_feedback = true
show_file_changes = true
syntax_validation = true

# Automation Capabilities
[automation]
# Command execution
auto_dependency_install = true
package_management = ["pip", "npm", "apt"]
environment_setup = true
path_resolution = true

# File operations
file_creation_templates = true
content_generation = true
format_conversion = true

# Progress Tracking
[progress_tracking]
# Detailed progress reporting
show_main_steps = true
show_substeps = true
show_tool_operations = true
show_command_execution = true
show_file_operations = true

# Status indicators
status_update_style = "detailed"  # Options: "minimal", "detailed", "animated"
progress_format = """
{step_number}. {current_action}
   Tool: {current_tool}
   Status: {status}
   Details: {operation_details}
"""

# Error Handling
[error_handling]
show_error_details = true
recovery_suggestions = true
alternative_solutions = true
user_guidance = true

# Tool Execution Management
[tool_execution]
# Tool execution constraints
max_consecutive_identical_calls = 3  # Prevent infinite loops of same tool
max_tool_calls_per_step = 5         # Limit tools per reasoning step
tool_call_timeout = 60              # Timeout for any single tool call (seconds)
json_validation = true              # Validate JSON before sending to API
backoff_strategy = "exponential"    # How to back off on errors

# Loop Detection & Recovery
[loop_detection]
enabled = true
detection_threshold = 3             # Number of identical actions before triggering
action_similarity_threshold = 0.85  # How similar actions must be to be considered the same
recovery_strategies = [
    "change_approach",
    "simplify_task",
    "skip_current_step",
    "reset_context"
]
max_recovery_attempts = 3           # Maximum attempts to recover from a loop

# Message Management
[message_management]
context_window_usage_limit = 0.85   # Maximum % of context window to use
message_pruning_enabled = true      # Prune messages when context gets full
preserve_tool_calls = true          # Always keep tool calls and responses
message_format_validation = true    # Validate message formats before sending

# File Processing
[file_processing]
# C# specific settings
[file_processing.csharp]
max_file_size = 1048576            # 1 MB limit for C# files
backup_before_edit = true          # Create backups before editing
syntax_validation = true           # Validate C# syntax after edits
intelligent_chunking = true        # Smart file chunking for large files
documentation_templates = [
    "class_template",
    "method_template",
    "property_template",
    "interface_template"
]

# API Resilience
[api_resilience]
max_retries = 5                    # Maximum retry attempts
retry_backoff_base = 2             # Exponential backoff base
retry_jitter = 0.2                 # Add jitter to retry timing
retry_status_codes = [429, 500, 502, 503, 504]  # Retry on these HTTP status codes
validate_response_format = true    # Validate API response format
fallback_models = ["gpt-3.5-turbo", "claude-3-haiku"]  # Fallback models if primary fails

# Task Progress & Completion
[task_progress]
granular_progress_steps = true     # Show more detailed progress steps
show_task_breakdown = true         # Show task breakdown before execution
completion_criteria_check = true   # Verify task is actually complete
progress_indicator_style = "detailed"  # More detailed progress indicators
status_update_frequency = 3        # Updates every 3 seconds

# Python Task Execution
[python_task_execution]
# Python execution constraints
validate_python_code = true         # Validate Python code before execution
sanitize_inputs = true              # Sanitize inputs for security
capture_output_limit = 10240        # Max bytes to capture from output (10KB)
execution_timeout = 120             # Timeout for Python execution (seconds)
environment_isolation = true        # Run in isolated environment

# C# Documentation Generation
[csharp_documentation]
# Documentation style preferences
doc_style = "xml"                   # Use XML documentation style
include_class_docs = true           # Document classes
include_method_docs = true          # Document methods
include_property_docs = true        # Document properties
include_field_docs = true           # Document fields
include_param_docs = true           # Document parameters
include_return_docs = true          # Document return values
include_exception_docs = true       # Document exceptions
include_example_docs = true         # Include examples where useful
include_see_references = true       # Include see references
include_related_types = true        # Document related types

# Documentation templates
[csharp_documentation.templates]
class_template = """/// <summary>
/// {class_description}
/// </summary>
/// <remarks>
/// {additional_information}
/// </remarks>"""

method_template = """/// <summary>
/// {method_description}
/// </summary>
/// <param name="{param_name}">{param_description}</param>
/// <returns>{return_description}</returns>
/// <exception cref="{exception_type}">{exception_description}</exception>
/// <remarks>
/// {additional_information}
/// </remarks>"""

property_template = """/// <summary>
/// {property_description}
/// </summary>
/// <value>{value_description}</value>"""

# C# Document Processing Steps
[csharp_documentation.processing_steps]
analysis_steps = [
    "parse_cs_file",
    "identify_structure",
    "determine_missing_docs",
    "generate_docs",
    "apply_docs",
    "validate_syntax",
    "save_file"
]
file_backup_enabled = true       # Backup file before modifying
progress_reporting = true        # Report progress during processing
validation_after_changes = true  # Validate file after changes
max_retries_per_file = 3        # Max retries per file on failure
parallel_file_processing = false # Process one file at a time for safety

# Task Execution Feedback
[task_execution_feedback]
show_detailed_steps = true          # Show detailed steps
show_code_preview = true            # Show code preview before execution
show_execution_time = true          # Show execution time
show_resource_usage = true          # Show resource usage
show_error_context = true           # Show error context
error_remediation_suggestions = true # Suggest fixes for errors

# API Interaction Improvements
[api_interaction]
# Handling API messages correctly
validate_request_format = true         # Validate requests before sending
enforce_tool_call_format = true        # Ensure tool calls have correct format
message_structure_validation = true    # Validate message structure
prevent_invalid_tool_responses = true  # Prevent invalid tool responses
json_escape_backslashes = true         # Properly escape backslashes in JSON
handle_windows_paths = true            # Special handling for Windows paths
max_message_size = 32768               # Max size for individual messages
prevent_truncation = true              # Prevent message truncation

# Message Sequence Management
[message_sequence]
enforce_conversation_flow = true       # Enforce proper conversation flow
validate_tool_call_responses = true    # Validate tool call responses
prevent_tool_response_mismatch = true  # Prevent mismatched tool responses
validate_tool_call_arguments = true    # Validate tool call arguments
message_sequence_validation = true     # Validate complete message sequence
handle_concurrent_tool_calls = true    # Handle concurrent tool calls properly
retry_invalid_sequences = true         # Retry on invalid sequences
sequence_error_detection = true        # Detect sequence errors

# Context Management
[context_management]
smart_context_pruning = true           # Intelligently prune context when needed
important_message_preservation = true  # Preserve important messages
prioritize_recent_messages = true      # Prioritize recent messages
compress_repetitive_messages = true    # Compress repetitive messages
progressive_summarization = true       # Progressively summarize older messages
max_context_tokens = 65000            # Maximum context tokens (keep under model limit)
context_utilization_target = 0.8      # Target context utilization (percentage)

# Model-Specific Optimizations 
[model_optimizations.deepseek]
# DeepSeek-specific optimizations
optimize_prompts = true               # Optimize prompts for DeepSeek
proper_tool_calling_format = true     # Use proper tool calling format
context_efficiency = true             # Optimize context efficiency
prevent_hallucinated_tool_calls = true # Prevent hallucinated tool calls
handle_code_execution_safely = true   # Handle code execution safely
max_tokens_per_request = 60000        # Maximum tokens per request
optimize_for_reasoning = true         # Optimize for reasoning tasks

# Sub-Agent Configuration
[sub_agents]
enabled = true
agent_storage_dir = "agents/generated"    # Directory to store dynamically generated agent code
max_concurrent_agents = 5                 # Maximum number of concurrent sub-agents
lifespan_management = "adaptive"          # Options: "task", "session", "persistent"
communication_protocol = "message_passing" # How agents communicate with each other
agent_specialization = true               # Whether agents should specialize in specific tasks

# Dynamic Agent Generation
[dynamic_agents]
code_generation_enabled = true            # Enable dynamic code generation for agents
template_dir = "agents/templates"         # Templates for generating agent code
persist_generated_agents = true           # Save generated agents for future use
validation_before_execution = true        # Validate generated agent code before execution
inheritance_model = "compositional"       # How new agents inherit capabilities
allow_agent_customization = true          # Allow agents to customize their own code

# Agent Persistence Layer
[agent_persistence]
storage_type = "sqlite"                   # Options: "sqlite", "json", "memory"
database_path = "data/agent_store.db"     # SQLite database path
backup_frequency = 300                    # Backup frequency in seconds
version_control = true                    # Track versions of agent code
capability_indexing = true                # Index agent capabilities for quick lookup
tool_usage_tracking = true                # Track tool usage statistics
state_persistence = true                  # Persist agent state between sessions

# Multi-Agent Coordination
[multi_agent_coordination]
orchestration_model = "central"           # Options: "central", "decentralized", "hybrid"
task_delegation_enabled = true            # Enable task delegation between agents
capability_discovery = true               # Enable capability discovery
conflict_resolution = "consensus"         # How to resolve conflicts between agents
shared_memory_enabled = true              # Enable shared memory between agents
coordination_protocols = [
    "request_response",
    "publish_subscribe",
    "blackboard"
]

# Schema Registry for Agent Communication
[schema_registry]
enabled = true
schema_validation = true
auto_schema_generation = true
schema_evolution_tracking = true
compatibility_checking = true
schema_storage_path = "data/schemas"

# Agent Capabilities Management
[agent_capabilities]
dynamic_capability_loading = true
capability_marketplace = true
capability_composition = true
capability_versioning = true
capability_dependencies = true
capability_discovery = true

