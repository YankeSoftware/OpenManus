# Document Conversion Configuration
[document_conversion]
# Supported input formats
input_formats = ["xlsx", "csv", "json", "xml", "yaml", "cs"]
# Supported output formats
output_formats = ["docx", "pdf", "html", "md"]
# Template configurations
template_dir = "templates/"
style_dir = "styles/"
# Progress reporting
show_detailed_progress = true
progress_update_interval = 1.0  # seconds

# Progress Reporting Configuration
[progress_reporting]
enabled = true
detailed_steps = true
show_substeps = true
progress_bar = true
estimated_time = true
error_reporting = "detailed"  # Options: "minimal", "detailed", "debug"

# Global LLM configuration
[llm]
model = "deepseek-reasoner"  # DeepSeek-R1 model for regular queries
base_url = "https://api.deepseek.com/v1"  # Adjust based on actual API endpoint
api_key = "sk-aaa0a2708abf436dbe5d420bd36d68f5"
max_tokens = 4096  # Correct max tokens value
temperature = 0.3  # Lower temperature for more focused reasoning
api_type = "openai"
api_version = ""  # Not needed for standard OpenAI API

# Function calling model configuration
[llm.function_calling]
model = "deepseek-coder"  # Model that supports function calling
max_tokens = 2048  # Reduced max tokens for deepseek-coder
temperature = 0.3
base_url = "https://api.deepseek.com/v1"
api_key = "sk-aaa0a2708abf436dbe5d420bd36d68f5"
api_type = "openai"
api_version = ""

# Model-specific settings for DeepSeek
[llm.deepseek]
context_window = 65536  # DeepSeek's actual context window (updated from 8192)
system_prompt = """You are an advanced AI assistant powered by DeepSeek-R1, specializing in:
1. Hierarchical planning and reasoning
2. Dynamic knowledge graph manipulation
3. Chain-of-Action verification
4. Transparent decision making

Focus on providing clear, logical reasoning steps and maintain awareness of the operational context."""

# Trust-Verify Flow Configuration
[trust_verify]
# Trust level thresholds for action verification (0.0 - 1.0)
high_trust_threshold = 0.0     # No verification needed
medium_trust_threshold = 0.3   # 30% of actions verified
low_trust_threshold = 0.8     # 80% of actions verified
zero_trust_threshold = 1.0    # Always verified

# Logging and transparency settings
show_thinking = true          # Show agent reasoning
show_approvals = true         # Show approval requests
detailed_summaries = true     # Generate detailed execution summaries

# DeepSeek-R1 Specific Settings
[deepseek]
# Reasoning configuration
reasoning_temperature = 0.3    # Lower temperature for reasoning steps
planning_temperature = 0.7    # Slightly higher for creative planning
execution_temperature = 0.0   # Precise execution

# Context management
max_reasoning_steps = 5       # Maximum steps in reasoning chain
context_overlap = 0.3         # Context overlap between steps
memory_buffer_size = 8196     # Size of working memory buffer

# Document handling and chunking (new section)
[document_processing]
# Maximum size for document chunks (in tokens)
max_chunk_size = 50000        # Well below context window to leave room for reasoning
# Overlap between chunks (in tokens)
chunk_overlap = 1000          # For maintaining context between chunks
# Number of chunks to process in a single run
max_chunks_per_session = 2    # Process in sequential batches
# Safety margin to prevent token limit errors (percentage of context window)
token_safety_margin = 0.2     # 20% margin below maximum

# Adding new capabilities
intelligent_parsing = true
auto_formatting = true
structure_detection = true
smart_templating = true
content_validation = true
error_correction = true

# Workflow Automation
[workflow]
auto_detection = true
smart_conversion = true
quality_checks = true
validation_steps = [
    "structure",
    "content",
    "formatting",
    "completeness",
    "consistency"
]
recovery_enabled = true
backup_enabled = true

# Enhanced Logging
[logging]
level = "INFO"
format = "detailed"
progress_tracking = true
step_validation = true
performance_metrics = true
error_tracking = true

# AI Enhancement Settings
[ai_capabilities]
content_understanding = true
format_detection = true
smart_conversion = true
quality_assurance = true
error_prevention = true
adaptive_processing = true

# Performance Settings
[performance]
parallel_processing = true
max_threads = 4
memory_management = "adaptive"
optimization_level = "high"
caching_enabled = true

